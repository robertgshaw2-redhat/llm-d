# P/D disaggregation with hybrid saturation detection (queue depth + concurrency).
#
# Requires a custom EPP image carrying the max-saturation-detector plugin: build it
# from llm-d-router @ d242a2ec with 0001-feat-flowcontrol-add-max-saturation-detector-composi.patch
# applied (see README.md in this directory), then point router.epp.image at it.
#
# Admission (flow control) gates on max(pd-concurrency, pd-queue), evaluated per
# stage (prefill / decode) and combined as the effective signal. Both children are
# also listed as filters in both scheduling profiles, so individual endpoints past
# their per-endpoint limits are dropped from candidate sets during routing.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    # Single EPP replica: the inflight-load-producer's in-flight accounting (which
    # pd-concurrency, the token-load-scorer and the affinity filter consume) is
    # local to each EPP process, so multiple replicas would each see only a
    # fraction of the per-endpoint load.
    replicas: 1
    # Custom build carrying max-saturation-detector; the chart's default EPP image
    # rejects this config with "plugin type 'max-saturation-detector' is not
    # registered". Replace with the registry/tag you pushed (README.md, step 2).
    image:
      registry: <your-registry>
      repository: llm-d-router
      tag: hybrid-saturation-d242a2ec
    pluginsConfigFile: "pd-config.yaml"
    pluginsCustomConfig:
      pd-config.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        featureGates:
        - flowControl
        plugins:
        - type: always-disagg-pd-decider
        - type: disagg-profile-handler
          parameters:
            deciders:
              prefill: always-disagg-pd-decider
        - type: prefill-filter
        - type: decode-filter
        - type: approx-prefix-cache-producer
          parameters:
            maxPrefixTokensToMatch: 131072
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
          parameters:
            peakPrefillThroughput: 33821
        - type: token-load-scorer
        - type: active-request-scorer
        - type: max-score-picker
        # Saturation detection. The children must be declared before pd-saturation:
        # the composite's factory resolves them by name when it is instantiated.
        - name: pd-concurrency
          type: concurrency-detector
          parameters:
            concurrencyMode: requests
            maxConcurrency: 32
            headroom: 0.1
        # Queue depth as a real admission gate (not just a per-endpoint filter).
        # kvCacheUtilThreshold: 1.0 keeps KV pressure out of the gating signal.
        # NOTE: with the default stalenessPolicy (saturated), a stalled metrics
        # scrape scores every endpoint as saturated and halts dispatch; set
        # stalenessPolicy: ignore to fail open instead.
        - name: pd-queue
          type: utilization-detector
          parameters:
            queueDepthThreshold: 5
            kvCacheUtilThreshold: 1.0
            headroom: 0.1
        - name: pd-saturation
          type: max-saturation-detector
          parameters:
            detectors: [pd-concurrency, pd-queue]
        schedulingProfiles:
        # Prefill does the prompt pass: keep prefix groups on cache-warm pods
        # (affinity filter) and pick by queued prefill token load. Both detectors
        # filter out endpoints past their per-endpoint limits first.
        - name: prefill
          plugins:
          - pluginRef: prefill-filter
          - pluginRef: pd-concurrency
          - pluginRef: pd-queue
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
          - pluginRef: max-score-picker
        # Pure decode is bound by concurrent in-flight requests: pick the
        # least-busy endpoint among those under both detectors' limits.
        - name: decode
          plugins:
          - pluginRef: decode-filter
          - pluginRef: pd-concurrency
          - pluginRef: pd-queue
          - pluginRef: active-request-scorer
          - pluginRef: max-score-picker
        flowControl:
          maxBytes: "10Gi"
          maxRequests: "1k"
          defaultRequestTTL: "60s"
          saturationDetector:
            pluginRef: pd-saturation

  modelServers:
    matchLabels:
      llm-d.ai/guide: "pd-disaggregation"
